name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:latest
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./nodeServer
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/api:latest
            ${{ steps.image.outputs.prefix }}/api:${{ github.sha }}

      - name: Trigger Jenkins webhook
        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
          JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$JENKINS_WEBHOOK_URL" ]; then
            echo "JENKINS_WEBHOOK_URL is required"
            exit 1
          fi

          if [ -n "$JENKINS_WEBHOOK_TOKEN" ]; then
            curl -fsSL -X POST "$JENKINS_WEBHOOK_URL" \
              -H "Authorization: Bearer $JENKINS_WEBHOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          else
            curl -fsSL -X POST "$JENKINS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          fi
