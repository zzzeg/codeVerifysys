name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PLATFORMS: linux/arm64

jobs:
  build:
    #runs-on: ubuntu-latest
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:latest
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./nodeServer
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/api:latest
            ${{ steps.image.outputs.prefix }}/api:${{ github.sha }}

      - name: Trigger Jenkins webhook
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "$JENKINS_USER" ]; then
            echo "Missing GitHub secret: JENKINS_USER"
            exit 1
          fi

          if [ -z "$JENKINS_API_TOKEN" ]; then
            echo "Missing GitHub secret: JENKINS_API_TOKEN"
            exit 1
          fi

          if [ -z "$JENKINS_WEBHOOK_URL" ]; then
            echo "Missing GitHub secret: JENKINS_WEBHOOK_URL"
            exit 1
          fi

          JENKINS_BASE_URL="$(echo "$JENKINS_WEBHOOK_URL" | sed -E 's#(/job/.*)$##')"
          CRUMB_API_URL="$JENKINS_BASE_URL/crumbIssuer/api/json"
          BUILD_URL="$JENKINS_WEBHOOK_URL"

          CRUMB_JSON="$(curl --silent --show-error \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            "$CRUMB_API_URL" || true)"

          if [ -n "$CRUMB_JSON" ] && echo "$CRUMB_JSON" | grep -q '"crumb"'; then
            CRUMB_FIELD="$(echo "$CRUMB_JSON" | sed -n 's/.*"crumbRequestField":"\([^"]*\)".*/\1/p')"
            CRUMB_VALUE="$(echo "$CRUMB_JSON" | sed -n 's/.*"crumb":"\([^"]*\)".*/\1/p')"

            curl --fail --show-error --silent \
              --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              -H "$CRUMB_FIELD: $CRUMB_VALUE" \
              -X POST \
              "$BUILD_URL"
          else
            curl --fail --show-error --silent \
              --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              -X POST \
              "$BUILD_URL"
          fi
