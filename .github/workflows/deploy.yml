name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:latest
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./nodeServer
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/api:latest
            ${{ steps.image.outputs.prefix }}/api:${{ github.sha }}

      - name: Trigger Jenkins webhook
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
          JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$JENKINS_USER" ]; then
            echo "Missing GitHub secret: JENKINS_USER"
            exit 1
          fi

          if [ -z "$JENKINS_API_TOKEN" ]; then
            echo "Missing GitHub secret: JENKINS_API_TOKEN"
            exit 1
          fi

          if [ -z "$JENKINS_WEBHOOK_URL" ]; then
            echo "Missing GitHub secret: JENKINS_WEBHOOK_URL"
            exit 1
          fi

          if [ -z "$JENKINS_WEBHOOK_TOKEN" ]; then
            echo "Missing GitHub secret: JENKINS_WEBHOOK_TOKEN"
            exit 1
          fi

          curl --fail --show-error --silent \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -X POST \
            "$JENKINS_WEBHOOK_URL?token=$JENKINS_WEBHOOK_TOKEN"
