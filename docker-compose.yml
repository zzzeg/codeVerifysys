services:
  frontend:
    image: ${GHCR_IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    container_name: verifysys-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api

  api:
    image: ${GHCR_IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    container_name: verifysys-api
    restart: unless-stopped
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      VERIFYSYS_MYSQL_HOST: ${DB_HOST}
      VERIFYSYS_MYSQL_PORT: ${DB_PORT}
      VERIFYSYS_MYSQL_DB: ${DB_NAME}
      VERIFYSYS_MYSQL_USER: ${DB_USER}
      VERIFYSYS_MYSQL_PASSWORD: ${DB_PASSWORD}
      VERIFYSYS_TRUST_PROXY: ${VERIFYSYS_TRUST_PROXY:-false}
      ENABLE_MOCK_PAYMENT_CALLBACK: ${ENABLE_MOCK_PAYMENT_CALLBACK:-false}
      CLIENT_DEV_SECRET: ${CLIENT_DEV_SECRET:-}
    volumes:
      - api-uploads:/app/uploads

volumes:
  api-uploads:
